name: "Example (manual): AD dispersion design + supercontinuum run"

# Manual, one-off demonstration job — NOT part of the regular push/PR CI
# matrix. Runs three AD-driven dispersion-design examples (ForwardDiff, not
# a project dependency) plus the full-resolution Dudley et al. (2006)
# supercontinuum reproduction, and uploads the resulting plots/log as a
# workflow artifact so results can be inspected without a local Julia
# install. See examples/README.md for the local-run instructions this
# mirrors; the scripts live in .github/scripts/ (tracked) rather than
# examples/ (git-ignored, local-only) purely so this workflow has something
# to check out and run.
on:
  workflow_dispatch:
  # TEMPORARY: fire once on push so the brand-new Enzyme job below gets its
  # first real CI run without waiting on a manual dispatch. Remove this
  # `push:` trigger once that run is confirmed green.
  push:
    branches:
      - claude/adjoint-propagation-compatibility-ymb2a1

jobs:
  run-example:
    name: Run AD dispersion example (Julia 1.12 - ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Add example-only dependencies (ForwardDiff, Plots)
        shell: julia --project=. --color=yes {0}
        run: |
          import Pkg
          Pkg.add(["ForwardDiff", "Plots"])
      - name: Run Sellmeier inverse-design example
        shell: julia --project=. --color=yes {0}
        run: |
          include(joinpath(pwd(), ".github", "scripts", "ad_dispersion_inverse_design.jl"))
      - name: Run dispersion-flattening example
        shell: julia --project=. --color=yes {0}
        run: |
          include(joinpath(pwd(), ".github", "scripts", "ad_dispersion_flattening.jl"))
      - name: Run dispersive-wave design + verification example
        shell: julia --project=. --color=yes {0}
        run: |
          include(joinpath(pwd(), ".github", "scripts", "ad_dispersive_wave_design.jl"))
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ad-dispersion-example-results
          path: .github/scripts/output/*.png
          if-no-files-found: warn
      # `*.png` is normally repo-gitignored (generated figures); force-add
      # just these result plots so they can be fetched via the GitHub API
      # (the Actions artifact ZIP lives on blob storage this session's
      # network policy doesn't allow reaching directly).
      - name: Commit result plots back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .github/scripts/output/*.png
          git diff --cached --quiet || git commit -m "ci: attach AD dispersion example output plots"
          git push

  run-enzyme-example:
    name: Run Enzyme-through-SSFM example (Julia 1.12 - ubuntu-latest)
    runs-on: ubuntu-latest
    # Runs as its own job (separate from run-example above) so Enzyme's
    # ~130s precompile isn't serialized after the already-long ForwardDiff/
    # Dudley-reproduction steps; `needs:` orders it *after* that job so the
    # two jobs' "commit result plots back" steps don't race to push to the
    # same branch from independent checkouts.
    #
    # CI run 32236352351 still hit a rejected push here even with `needs:`:
    # actions/checkout defaults to the fixed `github.sha` that triggered the
    # whole workflow run, not the branch's live tip, so this job's checkout
    # missed the commit run-example had *already* pushed on top of that SHA
    # by the time this job started. `ref: ${{ github.ref }}` checks out the
    # branch's current tip instead, picking up that commit.
    needs: run-example
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Add example-only dependencies (Enzyme, Plots)
        shell: julia --project=. --color=yes {0}
        run: |
          import Pkg
          Pkg.add(["Enzyme", "Plots"])
      - name: Run Enzyme-through-SSFM compression design example
        shell: julia --project=. --color=yes {0}
        run: |
          include(joinpath(pwd(), ".github", "scripts", "ad_ssfm_enzyme_compression.jl"))
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ad-ssfm-enzyme-example-results
          path: .github/scripts/output/*.png
          if-no-files-found: warn
      - name: Commit result plots back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .github/scripts/output/*.png
          git diff --cached --quiet || git commit -m "ci: attach Enzyme-through-SSFM example output plots"
          git push
