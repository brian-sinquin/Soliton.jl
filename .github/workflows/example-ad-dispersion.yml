name: "Examples: AD dispersion design + supercontinuum run"

# Each AD-driven example is its own job/CI check here, so a regression in
# any one of them shows up as its own named status on a PR rather than
# being buried inside one big job. Runs automatically on every PR (like the
# `test`/`enzyme`/`docs` jobs in CI.yml) plus on manual dispatch; it is a
# separate workflow file from CI.yml and shares nothing with its (slow)
# `docs` job, so nothing here ever triggers a documentation build.
#
# On `pull_request` runs, jobs only verify the script succeeds and upload
# the resulting plots as a build artifact — they do NOT commit anything
# back to the branch, since four jobs now run in parallel (no `needs:`
# ordering) and pushing from all of them would race. `workflow_dispatch`
# runs still commit the plots back (guarded by `github.event_name`) so a
# one-off manual run's results can be inspected without downloading the
# artifact ZIP. See examples/README.md for the local-run instructions this
# mirrors; the scripts live in .github/scripts/ (tracked) rather than
# examples/ (git-ignored, local-only) purely so this workflow has something
# to check out and run.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  run-sellmeier-example:
    name: Example - Sellmeier inverse design (Julia 1.12 - ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Add example-only dependencies (ForwardDiff, Plots)
        shell: julia --project=. --color=yes {0}
        run: |
          import Pkg
          Pkg.add(["ForwardDiff", "Plots"])
      - name: Run Sellmeier inverse-design example
        shell: julia --project=. --color=yes {0}
        run: |
          include(joinpath(pwd(), ".github", "scripts", "ad_dispersion_inverse_design.jl"))
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ad-sellmeier-example-results
          path: .github/scripts/output/*.png
          if-no-files-found: warn
      - name: Commit result plots back to the branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .github/scripts/output/*.png
          git diff --cached --quiet && exit 0
          git commit -m "ci: attach Sellmeier inverse-design example output plots"
          # These four jobs run in parallel with no `needs:` ordering between
          # them, so their pushes (each touching disjoint files) can race;
          # retry with a rebase onto the latest tip rather than serializing.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push result plots after retries." && exit 1

