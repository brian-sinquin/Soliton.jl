name: Precompiled Binary Release

on:
  push:
    tags:
      - 'v*'      # Trigger ONLY when a version tag is pushed (e.g. v0.2.0)
  workflow_dispatch: # Trigger manually for testing

jobs:
  build-sysimage:
    name: Compile Binary Sysimage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed by softprops/action-gh-release to create/update the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: GNLSE_sysimage.so
          - os: windows-latest
            artifact_name: GNLSE_sysimage.dll
          - os: macos-latest
            artifact_name: GNLSE_sysimage.dylib

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Build Package Environment
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(".")
          Pkg.instantiate()

      - name: Compile Native Binary Sysimage
        shell: julia --color=yes {0}
        env:
          SYSIMAGE_PATH: ${{ matrix.artifact_name }}
        run: |
          using Pkg
          # `include` with a relative path resolves against the currently
          # executing script's own directory (a GitHub Actions temp file
          # under _temp/), not the working directory — so a bare relative
          # path here silently looks in the wrong place. Anchor explicitly
          # to the checkout root.
          include(joinpath(pwd(), "deps", "build_sysimage.jl"))

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysimage-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

      - name: Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
