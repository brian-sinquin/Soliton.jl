name: CI
on:
  push:
    branches:
      - master
    tags: ["*"]
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.12"
          - "1.10"
          - "pre"
        os:
          - ubuntu-latest
        arch:
          - x64
          - x86
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  enzyme:
    # Separate job (not part of the main test matrix) because Enzyme pulls in
    # a large LLVM-based artifact and its i686/nightly-Julia support is less
    # battle-tested than the main dependency set; runs on a single platform
    # so it doesn't add weight or risk to every matrix cell above.
    name: Enzyme adjoint-AD extension (Julia 1.12 - ubuntu-latest - x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run Enzyme adjoint-AD extension tests
        shell: julia --project=. --color=yes {0}
        run: |
          import Pkg
          Pkg.add("Enzyme")
          # `include` resolves relative paths against the including file's
          # directory, not `pwd()` — and this script itself is written to a
          # runner temp dir by `shell:`, not the checkout, so a bare relative
          # path here silently looks in the wrong place.
          include(joinpath(pwd(), "test", "test_enzyme.jl"))
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Upload Documentation Artifact (PR Preview)
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: docs/build/
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using Soliton
          DocMeta.setdocmeta!(Soliton, :DocTestSetup, :(using Soliton); recursive=true)
          doctest(Soliton)
